name: Deploy LittleLand GitHub Pages

on:
  workflow_dispatch:
    inputs:
      deploy_site:
        description: "Set true only after reviewing the artifact for this run."
        required: true
        default: false
        type: boolean
      staff_source_sha:
        description: "Optional full commit SHA from release/production-v32 for an approved Staff-only overlay."
        required: false
        type: string
      staff_files:
        description: "Optional newline-separated allowlist: staff/app.js, staff/index.html, staff/new-booking-form.js, staff/new-booking-view.js."
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: littleland-pages
  cancel-in-progress: false

jobs:
  build:
    if: github.ref == 'refs/heads/feature/booking-ui'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: read
    steps:
      - name: Check out current Pages source snapshot
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          path: source
          fetch-depth: 0

      - name: Check out optional Staff-only source snapshot
        if: ${{ inputs.staff_source_sha != '' }}
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.staff_source_sha }}
          path: staff-overlay
          fetch-depth: 0

      - name: Apply only explicitly listed Staff files
        shell: bash
        env:
          STAFF_SOURCE_SHA: ${{ inputs.staff_source_sha }}
          STAFF_FILES: ${{ inputs.staff_files }}
        run: |
          set -euo pipefail
          if [[ -z "$STAFF_SOURCE_SHA" && -z "$STAFF_FILES" ]]; then
            echo "No Staff overlay requested; using the Pages source snapshot unchanged."
            exit 0
          fi
          if [[ -z "$STAFF_SOURCE_SHA" || -z "$STAFF_FILES" ]]; then
            echo "::error::Both staff_source_sha and staff_files are required for an overlay."
            exit 1
          fi
          if [[ ! "$STAFF_SOURCE_SHA" =~ ^[0-9a-fA-F]{40}$ ]]; then
            echo "::error::staff_source_sha must be a full 40-character commit SHA."
            exit 1
          fi
          actual_sha="$(git -C staff-overlay rev-parse HEAD)"
          if [[ "${actual_sha,,}" != "${STAFF_SOURCE_SHA,,}" ]]; then
            echo "::error::Checked-out Staff source does not match staff_source_sha."
            exit 1
          fi
          git -C staff-overlay fetch --no-tags origin +refs/heads/release/production-v32:refs/remotes/origin/release/production-v32
          if ! git -C staff-overlay merge-base --is-ancestor "$STAFF_SOURCE_SHA" origin/release/production-v32; then
            echo "::error::Staff source SHA is not on release/production-v32."
            exit 1
          fi
          while IFS= read -r file || [[ -n "$file" ]]; do
            [[ -z "$file" ]] && continue
            case "$file" in
              staff/app.js|staff/index.html|staff/new-booking-form.js|staff/new-booking-view.js) ;;
              *) echo "::error::Overlay path is not on the Staff allowlist: $file"; exit 1 ;;
            esac
            if [[ "$file" == *".."* || "$file" == /* ]]; then
              echo "::error::Unsafe overlay path: $file"
              exit 1
            fi
            if [[ ! -f "staff-overlay/$file" || ! -f "source/$file" ]]; then
              echo "::error::Overlay file is missing from the source or Pages snapshot: $file"
              exit 1
            fi
            cp -- "staff-overlay/$file" "source/$file"
            echo "Applied approved Staff file: $file"
          done <<< "$STAFF_FILES"
          changed="$(git -C source diff --name-only)"
          while IFS= read -r file; do
            [[ -z "$file" ]] && continue
            case "$file" in
              staff/app.js|staff/index.html|staff/new-booking-form.js|staff/new-booking-view.js) ;;
              *) echo "::error::Unexpected source modification outside Staff allowlist: $file"; exit 1 ;;
            esac
          done <<< "$changed"

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Build site with GitHub Pages Jekyll builder
        uses: actions/jekyll-build-pages@v1
        with:
          source: ./source
          destination: ./_site

      - name: Verify required site entry points
        run: |
          test -s _site/booking/index.html
          test -s _site/staff/index.html

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./_site

  deploy:
    if: ${{ inputs.deploy_site == true }}
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy reviewed Pages artifact
        id: deployment
        uses: actions/deploy-pages@v4
